<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booking Test | Airport Express LLC</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            padding: 50px 30px;
            text-align: center;
            backdrop-filter: blur(8px);
        }

        .logo {
            width: 120px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        p {
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 35px;
            font-size: 1rem;
        }

        .booking-button {
            background-color: #006aff;
            color: #ffffff;
            text-decoration: none;
            height: 50px;
            line-height: 50px;
            padding: 0 34px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: inline-block;
            transition: 0.25s ease;
        }

        .booking-button:hover {
            background-color: #0054d1;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .footer a {
            color: #60a5fa;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 1.7rem;
            }

            .booking-button {
                width: 100%;
                max-width: 320px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Optional Logo -->
        <!-- Replace with your actual logo path if desired -->
        <!-- <img src="img/asheville_airport_express_logo.png" alt="Airport Express Logo" class="logo"> -->

        <h1>Airport Express Booking Test</h1>

        <p>
            Test the Square Appointments booking flow for Airport Express LLC.
            This page is for internal testing and appointment integration validation.
        </p>

        <!-- Start Square Appointments Embed code -->
        <a
            class="booking-button"
            href="https://app.squareup.com/appointments/buyer/widget/vdw75g26fgwigc/LQH2CVXJGT28M"
        >
            Book an Appointment
        </a>
        <!-- End Square Appointments Embed code -->

        <div class="footer">
            <p>
                Visit us online:
                <a href="https://asheville.airportexpress.us/" target="_blank">
                    asheville.airportexpress.us
                </a>
            </p>
        </div>

    </div>

</body>
</html>
